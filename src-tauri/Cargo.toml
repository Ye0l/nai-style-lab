[package]
name = "nai-style-lab"
version = "4.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
