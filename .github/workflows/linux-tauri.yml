name: Linux Tauri
on:
  push:
    branches: [main, 'port/**']
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install WebKit and build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf
      - run: python -m pip install -r requirements-linux.txt
      - run: python _dev/tests/test_core.py && python _dev/tests/test_bridge.py && python _dev/tests/test_tauri_backend.py
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run build -- --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: nai-style-lab-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
